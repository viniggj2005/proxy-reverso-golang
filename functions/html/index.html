<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página não encontrada</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --text: #1e293b;
            --accent: #3b82f6;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        img {
            width: 100%;
            max-width: 500px;
            margin-bottom: 2rem;
        }
        h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #475569;
        }
        p {
            font-size: 1.1rem;
            color: #64748b;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background-color: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="data:image/png;base64,$b64" alt="404 - Lost">
        <p>A página que você está procurando parece não existir ou foi movida.</p>
        <a href="/" class="btn">Voltar ao Início</a>
    </div>
</body>
</html>
